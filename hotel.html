<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Hotel Booking - Kashmir</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page-wrap">
        <header class="header">
            <div class="logo">
                <img src="gallery/logo.jpg" alt="Kashmir logo">
                <div>
                    <h1 class="site-title">Tourism in Kashmir</h1>
                    <div style="font-size:0.95rem; color:var(--muted)">Book a calm stay</div>
                </div>
            </div>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="heritage.html">Heritage</a>
                <a href="hotel.html">Hotel Booking</a>
                <a href="gallery.html">Gallery</a>
            </nav>
        </header>

        <main class="container">
            <h2>Hotel Booking Form</h2>
            <p>Please fill in the details below to request a booking. Fields marked with * are required.</p>

            <form action="#" method="post" novalidate>
                <label for="name">Full name *</label>
                <input id="name" name="name" type="text" required placeholder="Your full name">

                <label for="email">Email address *</label>
                <input id="email" name="email" type="email" required placeholder="you@example.com">

                <label for="phone">Phone number *</label>
                <input id="phone" name="phone" type="tel" required placeholder="+91 98XXXXXXXX">

                <label for="checkin">Check-in date *</label>
                <input id="checkin" name="checkin" type="date" required>

                <label for="checkout">Check-out date *</label>
                <input id="checkout" name="checkout" type="date" required>

                <label for="guests">Number of guests *</label>
                <input id="guests" name="guests" type="number" min="1" value="1" required>

                <label for="room">Room type *</label>
                <select id="room" name="room" required>
                    <option value="">Select a room type</option>
                    <option>Single</option>
                    <option>Double</option>
                    <option>Deluxe</option>
                    <option>Suite</option>
                </select>

                <label for="bed">Bed preference</label>
                <select id="bed" name="bed">
                    <option>Any</option>
                    <option>King</option>
                    <option>Queen</option>
                    <option>Twin</option>
                </select>

                <label for="requests">Special requests</label>
                <textarea id="requests" name="requests"
                    placeholder="Dietary needs, accessibility, late arrival, etc."></textarea>

                <label>
                    <input type="checkbox" name="airport" value="yes"> Airport pickup required
                </label>

                <button class="primary" type="submit">Submit Booking Request</button>
            </form>
        </main>

        <footer class="footer">
            We will contact you to confirm availability and rates.
        </footer>
    </div>
</body>

</html>
